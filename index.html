<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Квест: Алекс и Алиса</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #game-container { max-width: 800px; width: 100%; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        #media-box { width: 100%; height: 400px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        #game-image, #game-video { width: 100%; height: 100%; object-fit: cover; }
        #status-bar { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #dialogue-text { font-size: 18px; line-height: 1.6; margin-bottom: 20px; min-height: 80px; }
        .btn { display: block; width: 100%; background: #2c2c2c; color: #fff; border: 1px solid #444; padding: 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 16px; transition: background 0.2s; }
        .btn:hover { background: #3a3a3a; border-color: #ff4081; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <span id="location-display">Локация: Парк</span>
        <span>Симпатия: <strong id="score-display">50</strong></span>
    </div>
    <div id="media-box">
        <img id="game-image" src="image 1.jpg" alt="Алиса">
        <video id="game-video" style="display:none;"></video>
    </div>
    <div id="dialogue-text">Алиса увлеченно смотрит в свой смартфон. Алекс решает подойти...</div>
    <div id="options-box"></div>
</div>

<!-- Подключаем внешний файл со сценарием -->
<script src="script.js"></script>
<script>
let simpatia = 50;
let currentRound = 1;
let isAlisaTurn = false;
let episode = 1;

const imgElement = document.getElementById('game-image');
const videoElement = document.getElementById('game-video');
const textElement = document.getElementById('dialogue-text');
const optionsElement = document.getElementById('options-box');
const scoreElement = document.getElementById('score-display');
const locationElement = document.getElementById('location-display');

function playVideo(videoName, callback = null) {
    imgElement.style.display = 'none';
    videoElement.style.display = 'block';
    videoElement.src = videoName;
    videoElement.loop = false;
    videoElement.play().catch(e => console.log("Плеер ждет клика"));
    videoElement.onended = () => { if (callback) callback(); };
}

function updateMedia() {
    if (simpatia <= 35) {
        let loseVid = (episode === 1) ? "Refusal.mp4" : "Refusal 2.mp4";
        playVideo(loseVid, () => { triggerGameOver("Алиса прервала общение."); });
        return;
    }
    playVideo(getEmotionVideo(simpatia, episode));
}

function renderStep() {
    scoreElement.innerText = simpatia;
    optionsElement.innerHTML = "";

    if (currentRound === 2 && episode === 1) {
        if (simpatia >= 65) {
            episode = 2; currentRound = 2;
            locationElement.innerText = "Локация: Уютное кафе";
            imgElement.src = "image 2.jpg"; imgElement.style.display = 'block'; videoElement.style.display = 'none';
            textElement.innerHTML = "Вы переместились в вечернее кафе. Алиса изучает меню...";
            playVideo("Agreement.mp4");
        } else {
            triggerGameOver("Алиса отказалась идти в кафе."); return;
        }
    }

    if (currentRound === 3 && episode === 2) {
        handleFinalEvaluation(); return;
    }

    let activeSide = isAlisaTurn ? scriptData[currentRound].alisa : scriptData[currentRound].alex;
    textElement.innerHTML = activeSide.text;

    activeSide.options.forEach(opt => {
        let button = document.createElement('button');
        button.className = 'btn';
        button.innerHTML = opt.text;
        button.onclick = () => {
            simpatia += opt.points;
            textElement.innerHTML = opt.reply;
            isAlisaTurn = !isAlisaTurn;
            if(!isAlisaTurn) currentRound++;
            updateMedia();
            setTimeout(renderStep, 4000);
        };
        optionsElement.appendChild(button);
    });
}

function handleFinalEvaluation() {
    if (simpatia >= 100) {
        textElement.innerHTML = "<strong>Супер-Победа!</strong> Вы едете к Алексу домой.";
        playVideo("Agreement 2.mp4", () => { playVideo("final.mp4"); });
    } else if (simpatia >= 75) {
        textElement.innerHTML = "<strong>Пауза.</strong> Согласие на второе свидание.";
        playVideo("Interest 2.mp4");
    } else {
        textElement.innerHTML = "<strong>Отказ.</strong> Конец отношений.";
        playVideo("Refusal 2.mp4");
    }
}

function triggerGameOver(msg) {
    optionsElement.innerHTML = "";
    textElement.innerHTML = `<strong>Конец игры:</strong> ${msg}`;
    let btn = document.createElement('button'); btn.className = 'btn'; btn.innerText = "Заново";
    btn.onclick = () => { location.reload(); }; optionsElement.appendChild(btn);
}

renderStep();
</script>
</body>
</html>
